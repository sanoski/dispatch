<!doctype html>
<!--
  Dispatch: the GitHub social preview and README banner, 1280 x 640.
  Rendered by scripts/dispatch/demo-shots.mjs (shot "social-preview") from
  Joshua's artwork (ARTWORK.md, piece 4), with the wordmark and tagline
  drawn here so they stay sharp.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dispatch banner</title>
    <link rel="stylesheet" href="/src/styles/dispatch.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: #0f1720;
      }
      .banner {
        position: relative;
        width: 1280px;
        height: 640px;
        background: url("./social-art.webp") center / cover no-repeat;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(9, 15, 22, 0.72) 0%,
          rgba(9, 15, 22, 0.35) 42%,
          rgba(9, 15, 22, 0) 62%
        );
      }
      .words {
        position: absolute;
        left: 84px;
        top: 150px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .name {
        font-family: "Space Grotesk Variable", sans-serif;
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -1.6px;
        line-height: 1;
        color: #f2f7fb;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      }
      .tagline {
        font-family: "Inter Variable", sans-serif;
        font-size: 34px;
        font-weight: 600;
        color: #e8eff4;
        letter-spacing: -0.3px;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
      }
      .sub {
        font-family: "Inter Variable", sans-serif;
        font-size: 22px;
        font-weight: 500;
        color: #a9bccb;
        line-height: 1.45;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
      }
      .sub b {
        color: #7dd3fc;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="shade"></div>
      <div class="words">
        <div class="mark">
          <svg width="92" height="92" viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" rx="22" fill="#0E1A24" />
            <rect x="48" y="22" width="4" height="62" rx="1.5" fill="#A9BCCB" />
            <rect x="38" y="82" width="24" height="5" rx="2" fill="#A9BCCB" />
            <path
              d="M32 12 L68 32 M32 32 L68 12"
              fill="none"
              stroke="#E8EFF4"
              stroke-width="6"
              stroke-linecap="round"
            />
            <rect x="28" y="44" width="44" height="4" rx="2" fill="#A9BCCB" />
            <circle cx="32" cy="55" r="6.5" fill="#2A4152" />
            <circle cx="68" cy="55" r="6.5" fill="#7DD3FC" />
            <path
              d="M75.7 48.6 A10 10 0 0 1 75.7 61.4"
              fill="none"
              stroke="#7DD3FC"
              stroke-width="4"
              stroke-linecap="round"
            />
            <path
              d="M81 44.1 A17 17 0 0 1 81 65.9"
              fill="none"
              stroke="#7DD3FC"
              stroke-width="4"
              stroke-linecap="round"
              opacity="0.6"
            />
          </svg>
          <span class="name">Dispatch</span>
        </div>
        <div class="tagline">Local voice dictation for Windows</div>
        <div class="sub">
          Review every word. Fix it once.<br />
          <b>Everything stays on your computer.</b>
        </div>
      </div>
    </div>
  </body>
</html>
